<html> 
<head>
    <title>Greeting Message</title> 
    <style>
#lbl {
    font-family: cursive;
    font-size: xx-large;
    color: #674F3A;
    padding: 5px;
    border: 1px solid #674F3A;
    text-align: center;
    line-height: 1.5;
    height:85%


}
#date{
    font-size:large;
}
body{
    background-color: transparent;
}
    </style>
</head>
<body>
    <div id="lbl"></div>
</body>

<script>
    var weekday = new Array(7);
    weekday[0] = "Sunday";
    weekday[1] = "Monday";
    weekday[2] = "Tuesday";
    weekday[3] = "Wednesday";
    weekday[4] = "Thursday";
    weekday[5] = "Friday";
    weekday[6] = "Saturday";

    
    var today = new Date();
    var hrs = today.getHours();
    var dayOfWeek = weekday[today.getDay()];
    var date = dayOfWeek+" " + today.getDate() + "/" +(today.getMonth()+1) +'/'+today.getFullYear()  ;

    var greet;

    if (hrs < 12)
        greet = 'Good Morning  ';
    else if (hrs >= 12 && hrs <= 17)
        greet = 'Good Afternoon ';
    else if (hrs >= 17 && hrs <= 24)
        greet = 'Good Evening  ';

    document.getElementById('lbl').innerHTML =
          greet+= "Hannah" +`<div id="date"> It's ${date}</div>`;
    (function(){
  function setBodyBackground(){
    try{
      const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.body.style.background = isDark ? '#191919' : '#ffffff';
    } catch(e) {
      document.body.style.background = '#ffffff';
    }
  }
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addListener(setBodyBackground);
  }
  setBodyBackground();
})();
</script> 
</html>
